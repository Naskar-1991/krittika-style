<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#667eea" />

    <!-- Default SEO (overridden per-page by react-helmet-async) -->
    <title>Krittika Style — Handwoven Sarees from India</title>
    <meta name="description" content="Discover handwoven sarees crafted by master artisans — Banarasi silk, Kanjivaram, Handloom cotton, and more. Shop the Krittika Style collection with free delivery across India." />
    <link rel="canonical" href="https://www.krittikasarees.com" />

    <!-- Open Graph defaults -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Krittika Style — Handwoven Sarees from India" />
    <meta property="og:description" content="Discover handwoven sarees crafted by master artisans — Banarasi silk, Kanjivaram, Handloom cotton, and more." />
    <meta property="og:url"         content="https://www.krittikasarees.com" />
    <meta property="og:image"       content="https://www.krittikasarees.com/og-image.jpg" />
    <meta property="og:site_name"   content="Krittika Style" />
    <meta property="og:locale"      content="en_IN" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Krittika Style — Handwoven Sarees from India" />
    <meta name="twitter:description" content="Discover handwoven sarees crafted by master artisans." />
    <meta name="twitter:image"       content="https://www.krittikasarees.com/og-image.jpg" />

    <!-- Icons & PWA -->
    <link rel="icon"             href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest"         href="%PUBLIC_URL%/manifest.json" />

    <!-- Preconnect to backend API for faster product fetches -->
    <link rel="preconnect" href="https://krittika-backend.onrender.com" />
  </head>
  <body>
    <noscript>
      Krittika Style — Handwoven Sarees from India. Please enable JavaScript to browse our collection of Banarasi silk, Kanjivaram, and Handloom sarees.
    </noscript>
    <div id="root"></div>
  </body>
</html>
